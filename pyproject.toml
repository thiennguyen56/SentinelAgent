[project]
name = "sentinelagent"
version = "0.1.0"
description = ""
authors = [
    {name = "Mike Nguyen",email = "ducthien562000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "openai (>=3.19.2,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.11,<1"
alembic = "^1.20.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
